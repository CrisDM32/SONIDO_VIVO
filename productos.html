<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos - Sonido Vivo</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>

  <div id="header"></div>

  <main>
    <h1 class="section-title-productos">Catálogo de productos</h1>

    <section class="search-section">
      <input type="text" id="buscarProducto" class="input-buscar" placeholder="Buscar por nombre...">
      <button type="button" id="btnBuscar" class="search-button">Buscar</button>
    </section>

    <section id="catalogoGrid" class="catalogo-grid">
      <!-- Las tarjetas de producto se generan con js/productos.js -->
    </section>
  </main>

  <footer id="footer"></footer>

  <script src="js/productos.js"></script>
  <script src="js/components.js"></script>
</body>

</html>
