<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago - Sonido Vivo</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>

  <div id="header"></div>

  <main class="contenedor-ancho">
    <h1 class="section-title-productos">Pagar pedido</h1>

    <p class="aviso-simulacion">
      ⚠️ Esto es una simulación. No se procesa ningún pago real ni se
      verifican los datos de la tarjeta.
    </p>

    <div class="pago-layout">

      <section class="resumen-pedido">
        <h2>Resumen</h2>
        <div id="resumenPagoItems">
        </div>
        <div class="carrito-total-linea">
          <span>Total a pagar:</span>
          <span id="pagoTotal" class="carrito-total">$0</span>
        </div>
      </section>

      <section>
        <h2>Datos de la tarjeta (simulados)</h2>
        <form id="formPago">

          <div class="campo">
            <label for="nombreTitular">Nombre del titular</label>
            <input type="text" id="nombreTitular" placeholder="Como aparece en la tarjeta">
          </div>

          <div class="campo">
            <label for="numeroTarjeta">Número de tarjeta</label>
            <input type="text" id="numeroTarjeta" placeholder="4111 1111 1111 1111" maxlength="19">
          </div>

          <div class="campo-fila">
            <div class="campo">
              <label for="vencimiento">Vencimiento</label>
              <input type="text" id="vencimiento" placeholder="MM/AA" maxlength="5">
            </div>

            <div class="campo">
              <label for="cvv">CVV</label>
              <input type="text" id="cvv" placeholder="123" maxlength="4">
            </div>
          </div>

          <button type="button" id="btnPagar" class="boton-principal">Pagar ahora</button>

          <p id="pagoProcesando" class="pago-procesando" hidden>Procesando pago...</p>
        </form>
      </section>

    </div>
  </main>

  <footer id="footer"></footer>

  <script src="js/carrito.js"></script>
  <script src="js/pago.js"></script>
  <script src="js/components.js"></script>
</body>

</html>
