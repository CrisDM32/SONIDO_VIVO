services:
  db:
    image: postgres:16-alpine
    container_name: sonidovivo-db
    environment:
      POSTGRES_DB: sonidovivo
      POSTGRES_USER: sonidovivo
      POSTGRES_PASSWORD: sonidovivo
    ports:
      - "5432:5432"
    volumes:
      - sonidovivo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonidovivo -d sonidovivo"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: .
    container_name: sonidovivo-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sonidovivo
      SPRING_DATASOURCE_USERNAME: sonidovivo
      SPRING_DATASOURCE_PASSWORD: sonidovivo
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:4173"
      JWT_SECRETO: ${JWT_SECRETO:-sonido-vivo-clave-jwt-de-desarrollo-256-bits}
      ADMIN_CLAVE: ${ADMIN_CLAVE:-admin}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure:5
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /api/v1/productos HTTP/1.0\r\n\r\n\" >&3 && head -n1 <&3 | grep -q 200'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  sonidovivo-db:
