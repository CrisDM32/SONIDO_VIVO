spring.application.name=productos-service
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sonidovivo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sonidovivo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sonidovivo}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
app.jwt.secreto=${JWT_SECRETO:sonido-vivo-clave-jwt-de-desarrollo-256-bits}
app.jwt.expiracion-ms=${JWT_EXPIRACION_MS:28800000}
app.admin.clave=${ADMIN_CLAVE:admin}
