spring.application.name=ms-usuarios
server.port=8081

# Conexion a MySQL. Por defecto apunta al MySQL de XAMPP (puerto 3306, usuario
# root sin contrasena, que es como viene XAMPP de fabrica). createDatabaseIfNotExist=true
# hace que la base "sonidovivo_usuarios" se cree sola la primera vez que arranca,
# no hace falta crearla a mano en phpMyAdmin.
# Si en algun momento usas backend/docker-compose.yml en vez de XAMPP, esas
# variables de entorno pisan estos valores por defecto.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sonidovivo_usuarios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# update = crea/ajusta las tablas automaticamente a partir de las entidades.
# Sirve para el desarrollo; en un ambiente productivo se usarian migraciones (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Toda respuesta de error tambien sale en JSON (lo exige el documento del cliente)
server.error.include-message=always

# Secreto y duracion del token JWT.
# IMPORTANTE: este mismo secreto se repite en ms-productos/application.properties
# porque ambos microservicios deben poder validar el mismo token sin llamarse entre si.
# En un ambiente real este valor NO se versiona: va en una variable de entorno o un
# gestor de secretos (ver backend/docker-compose.yml donde se sobreescribe con env vars).
jwt.secret=${JWT_SECRET:sonidoVivoClaveSecretaDeDesarrolloCambiarEnProduccion123456}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

springdoc.swagger-ui.path=/swagger-ui.html
