spring.application.name=ms-productos
server.port=8082

# Conexion a MySQL. Por defecto apunta al mismo MySQL de XAMPP que ms-usuarios
# (puerto 3306, usuario root sin contrasena), pero usando su propia base de
# datos ("sonidovivo_productos") para no mezclar tablas entre microservicios.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sonidovivo_productos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.error.include-message=always

# MISMO secreto que ms-usuarios/application.properties: asi este microservicio
# puede validar un token emitido por ms-usuarios sin llamarlo por cada peticion.
jwt.secret=${JWT_SECRET:sonidoVivoClaveSecretaDeDesarrolloCambiarEnProduccion123456}

springdoc.swagger-ui.path=/swagger-ui.html
