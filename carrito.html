<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito - Sonido Vivo</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>

  <div id="header"></div>

  <main class="contenedor-ancho">
    <h1 class="section-title-productos">Mi carrito</h1>

    <div id="carritoContenido" class="carrito-lista">
    </div>

    <section class="carrito-resumen">
      <button type="button" id="btnVaciarCarrito" class="boton-secundario">Vaciar carrito</button>

      <div class="carrito-total-linea">
        <span>Total:</span>
        <span id="carritoTotal" class="carrito-total">$0</span>
      </div>

      <a href="pago.html" id="btnIrPagar" class="boton-principal boton-ancho-auto">Ir a pagar</a>
    </section>
  </main>

  <footer id="footer"></footer>

  <script src="js/carrito.js"></script>
  <script src="js/components.js"></script>
</body>

</html>
